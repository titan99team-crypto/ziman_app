name: Android Alpha Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Extract Alpha.4 source
        run: |
          mkdir -p source
          unzip -q "ziman_flutter_v1.0_alpha4_ci_build (1).zip" -d source
          mkdir -p source/.github/workflows
          cp .github/workflows/android_alpha_build.yml source/.github/workflows/android_alpha_build.yml
      - name: Apply Alpha.4 analyzer fixes
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ocr = Path('lib/services/ocr_service.dart')
          text = ocr.read_text()
          marker = '/// Downloads official Tesseract language packs once, then OCR works offline.'
          state = '''class OcrPackState {
            final String code;
            final String label;
            final String path;
            final bool installed;
            const OcrPackState({required this.code, required this.label, required this.path, required this.installed});
          }

          '''
          if 'class OcrPackState' not in text:
              ocr.write_text(text.replace(marker, state + marker))
          auth = Path('lib/services/auth_service.dart')
          text = auth.read_text()
          text = text.replace('Future<String?> idToken() => _auth?.currentUser?.getIdToken();', "Future<String?> idToken() async => _auth?.currentUser == null ? null : await _auth!.currentUser!.getIdToken();")
          auth.write_text(text)
          PY
      - name: Hydrate Gradle wrapper
        working-directory: source
        run: python3 tool/bootstrap_android_wrapper.py
      - name: Static preflight
        working-directory: source
        run: python3 tool/preflight.py
      - name: Get packages
        working-directory: source
        run: flutter pub get
      - name: Analyze
        working-directory: source
        run: flutter analyze
      - name: Unit tests
        working-directory: source
        run: flutter test
      - name: Build debug APK
        working-directory: source
        run: flutter build apk --debug --dart-define=ZIMAN_API_BASE_URL=https://api.example.invalid
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ziman-alpha4-debug-apk
          path: source/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
